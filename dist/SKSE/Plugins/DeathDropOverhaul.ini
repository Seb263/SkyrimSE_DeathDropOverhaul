; Death Drop Overhaul - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1


[Main]
# Allows weapons and shields to no longer be bound to the actors' skeletons upon their death (true/false).
# This will fix some physics issues and let you retrieve their gear directly from the ground.
bDropGear = true

# Keep weapons sheathed on corpse if they were not drawn at time of death (true/false).
bKeepGearSheathed = true

# Scale dropped weapon/shield based on actor's size
bScaleGear = true

# Always drop shield on death, regardless of combat state (true/false).
bAlwaysDropShield = true

# Allow reanimated actors to automatically recover their dropped gear (true/false).
bRestoreGearOnReanimate = true

# Determines whether physically dropped equipment can still be recovered from the dead NPC's inventory (true/false).
bDroppedEquipmentRecoverable = true

# This parameter determines how Immersive Equipment Displays (IED) integration is handled.
# Available modes:
#    0: IED items are completely ignored.
#    1: Only weapons and armors handled by IED will be processed.
#    2: All possible IED items will be processed (may cause visual inconsistencies due to how IED manages items).
iImmersiveEquipmentDisplays = 0


[CollisionTweak]
# Enables collision tweaking to prevent weapon-body interference (true/false).
bEnable = true

# Controls whether the weapon can collide with living characters (true/false).
# When disabled, visuals and behavior appear more natural, but telekinesis interaction is not available.
bEnableCharacterCollision = false

# Delay before restoring collision between dropped weapon and actor (in seconds).
fRestoreDelay = 2.0

# The radius around the node within which the weapon is considered attached; beyond this radius, it is considered detached.
fNodeDetachRadius = 10.0


[Motion]
# Enables momentum-based weapon drop behavior (true/false).
bEnable = true

# Multiplier applied to linear motion when weapon is dropped.
fLinearMult = 1.0

# Clamp value to limit excessive linear velocity.
fLinearClamp = 10.0

# Multiplier applied to angular (rotational) motion.
fAngularMult = 0.5

# Clamp value to limit excessive angular velocity.
fAngularClamp = 8.0


[Misc]
# Delay in in-game days before an item is automatically cleaned up.
fDespawnTimeout = 14.0

# Delay in seconds used to force the removal of dropped inventory from poorly integrated summoned NPCs 
# from other mods (i.e., NPCs not properly flagged as summoned) that cause inventory to persist. 
# Set to 0 to disable.
fFixFalseSummonedNPCDelay = 1.0

# Determines whether special NPCs (e.g., ghosts or NPCs that do not bleed) are prevented from dropping their inventory (true/false).
bExcludesSpecialNPCs = true

# Controls inventory restoration during the maintenance process.
#    0: The inventory restoration system remains fully operational.
#    1: Disables only the rare cases where PickUpObject is used for persistent objects.
#    2: Disables all inventory restoration. Items will be permanently removed from NPC inventories during the maintenance process.
iDisableInventoryRestoration = 0

# Clears the ownership of referenced objects (true/false).
bClearOwner = true
